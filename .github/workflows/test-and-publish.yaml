name: Test and publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: DeterminateSystems/flake-checker-action@main
        with:
          fail-mode: true

      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install Node.js dependencies
        run: nix develop --command npm ci

      - name: Lint and check formatting
        run: nix develop --command npm run check

      - name: Check that generated files are up to date
        run: nix develop --command npm run check:generated

      - name: Run grammar tests
        run: nix develop --command npm test

      - name: Package extension
        run: nix develop --command npm run package

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrl-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Publish
        if: success() && startsWith(github.ref, 'refs/tags/v')
        run: nix develop --command npm run publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
